[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "edgehunter"
version = "0.1.0"
description = "Auditable prediction-market research and virtual-money execution"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx==0.28.1",
  "numpy==2.3.3",
  "duckdb==1.4.0",
  "websockets==15.0.1",
  "tzdata==2026.4",
]

[project.urls]
Repository = "https://github.com/AnthonySmith96/edgehunter"
Issues = "https://github.com/AnthonySmith96/edgehunter/issues"

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.0", "mypy==1.18.1", "pytest-cov==6.3.0"]

[project.scripts]
edgehunter = "edgehunter.ops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edgehunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["external: explicitly enabled network/provider tests", "integration: local integration"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/edgehunter"]

[[tool.mypy.overrides]]
module = ["duckdb"]
ignore_missing_imports = true
